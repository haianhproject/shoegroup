# Mục đích: Cấu hình Spring: cổng API, kết nối SQL Server, email và tác vụ tự động.
spring.application.name=shoegroup-api
server.port=${SPRING_PORT:5000}
server.error.include-message=never
server.compression.enabled=true
server.compression.min-response-size=2KB
# Không nén SSE để sự kiện nhỏ được gửi ngay, không đợi đầy bộ đệm.
server.compression.mime-types=application/json,text/html,text/plain,text/css,application/javascript
spring.jackson.time-zone=Asia/Bangkok
spring.datasource.url=${SPRING_DB_URL:jdbc:sqlserver://${DB_SERVER:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:ShoegroupDB};encrypt=${DB_ENCRYPT:false};trustServerCertificate=${DB_TRUST_CERT:true}}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:123}
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.initialization-fail-timeout=-1
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.data-source-properties.sendStringParametersAsUnicode=true
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER:}
spring.mail.password=${EMAIL_PASS:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
shoegroup.schema-enabled=${SCHEMA_ENABLED:true}
shoegroup.jobs-enabled=${JOBS_ENABLED:true}
shoegroup.jobs-initial-delay=${JOBS_INITIAL_DELAY_MS:5000}
shoegroup.jobs-delay=${JOBS_DELAY_MS:3600000}
